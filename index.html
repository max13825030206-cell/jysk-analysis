<head>

<title>JYSK Market Intelligence</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f5f0; color: #2d2a26; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

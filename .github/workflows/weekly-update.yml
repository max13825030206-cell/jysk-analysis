name: Weekly JYSK Data Update

on:
  schedule:
    # 每周五 UTC 6:00 = 北京时间 14:00
    - cron: '0 6 * * 5'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install

      - name: Backup previous data for comparison
        run: |
          mkdir -p _data_prev
          if [ -f _data/drinking.json ]; then cp _data/drinking.json _data_prev/; fi
          if [ -f _data/plates.json ]; then cp _data/plates.json _data_prev/; fi
          if [ -f _data/accessories.json ]; then cp _data/accessories.json _data_prev/; fi
          # Save the date of last scrape
          if [ -f _data/scrape-date.txt ]; then cp _data/scrape-date.txt _data_prev/; fi

      - name: Scrape JYSK Kitchen products — Drinking Glasses & Mugs
        run: |
          mkdir -p _data
          agent-browser open "https://jysk.co.uk/homeware/kitchen/drinking-glasses-mugs" > /dev/null 2>&1
          agent-browser wait --load networkidle > /dev/null 2>&1
          agent-browser eval --stdin <<'EVALEOF' > _data/drinking.json 2>/dev/null
          var items = [];
          document.querySelectorAll('[class*="product"], [class*="item"], [class*="grid"] > div, [class*="list"] > div').forEach(function(el) {
            var allText = el.textContent.trim();
            if (allText.length < 20 || allText.length > 600) return;
            var nameEl = el.querySelector('h3, .name, [class*="title"]');
            if (!nameEl) return;
            var name = nameEl.textContent.trim();
            var priceEl = el.querySelector('[class*="price"]');
            var price = priceEl ? priceEl.textContent.trim().replace(/\s+/g, ' ') : '';
            var imgEl = el.querySelector('img');
            var img = imgEl ? imgEl.src : '';
            var linkEl = el.querySelector('a');
            var href = linkEl ? linkEl.href.split('?')[0] : '';
            items.push({n:name, p:price, i:img, u:href});
          });
          var seen = {};
          var unique = items.filter(function(x) {
            var k = x.n + '|' + x.p;
            if (seen[k]) return false;
            seen[k] = true;
            return true;
          });
          console.log(JSON.stringify(unique));
EVALEOF
          agent-browser close > /dev/null 2>&1

      - name: Scrape JYSK Kitchen products — Plates, Bowls & Cutlery
        run: |
          agent-browser open "https://jysk.co.uk/homeware/kitchen/plates-bowls-cutlery" > /dev/null 2>&1
          agent-browser wait --load networkidle > /dev/null 2>&1
          agent-browser eval --stdin <<'EVALEOF' > _data/plates.json 2>/dev/null
          var items = [];
          document.querySelectorAll('[class*="product"], [class*="item"], [class*="grid"] > div, [class*="list"] > div').forEach(function(el) {
            var allText = el.textContent.trim();
            if (allText.length < 20 || allText.length > 600) return;
            var nameEl = el.querySelector('h3, .name, [class*="title"]');
            if (!nameEl) return;
            var name = nameEl.textContent.trim();
            var priceEl = el.querySelector('[class*="price"]');
            var price = priceEl ? priceEl.textContent.trim().replace(/\s+/g, ' ') : '';
            var imgEl = el.querySelector('img');
            var img = imgEl ? imgEl.src : '';
            var linkEl = el.querySelector('a');
            items.push({n:name, p:price, i:img, u:linkEl ? linkEl.href.split('?')[0] : ''});
          });
          var seen = {};
          var unique = items.filter(function(x) {
            var k = x.n + '|' + x.p;
            if (seen[k]) return false;
            seen[k] = true;
            return true;
          });
          console.log(JSON.stringify(unique));
EVALEOF
          agent-browser close > /dev/null 2>&1

      - name: Scrape JYSK Kitchen products — Kitchen Accessories
        run: |
          agent-browser open "https://jysk.co.uk/homeware/kitchen/kitchen-accessories" > /dev/null 2>&1
          agent-browser wait --load networkidle > /dev/null 2>&1
          agent-browser eval --stdin <<'EVALEOF' > _data/accessories.json 2>/dev/null
          var items = [];
          document.querySelectorAll('[class*="product"], [class*="item"], [class*="grid"] > div, [class*="list"] > div').forEach(function(el) {
            var allText = el.textContent.trim();
            if (allText.length < 20 || allText.length > 600) return;
            var nameEl = el.querySelector('h3, .name, [class*="title"]');
            if (!nameEl) return;
            var name = nameEl.textContent.trim();
            var priceEl = el.querySelector('[class*="price"]');
            var price = priceEl ? priceEl.textContent.trim().replace(/\s+/g, ' ') : '';
            var imgEl = el.querySelector('img');
            var img = imgEl ? imgEl.src : '';
            var linkEl = el.querySelector('a');
            items.push({n:name, p:price, i:img, u:linkEl ? linkEl.href.split('?')[0] : ''});
          });
          var seen = {};
          var unique = items.filter(function(x) {
            var k = x.n + '|' + x.p;
            if (seen[k]) return false;
            seen[k] = true;
            return true;
          });
          console.log(JSON.stringify(unique));
EVALEOF
          agent-browser close > /dev/null 2>&1

      - name: Save scrape date
        run: date -u +"%Y-%m-%d" > _data/scrape-date.txt

      - name: Generate updated HTML with weekly comparison
        run: node .github/scripts/generate-page.mjs

      - name: Commit updated data for next week comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/ _site/
          git diff --cached --quiet || git commit -m "Weekly data update [auto]" && git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

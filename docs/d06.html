<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D06 ERP · 打开中</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f5f0; color: #2d2a26; margin: 0; padding: 48px 20px; text-align: center; }
    h1 { font-size: 1.25rem; color: #1a4a3e; }
    p { color: #6b6560; line-height: 1.6; max-width: 420px; margin: 12px auto; }
    a { color: #1a4a3e; }
  </style>
</head>
<body>
  <h1>正在打开 D06 开发 ERP</h1>
  <p id="msg">固定入口，至少一周有效。正在连接当前在线地址…</p>
  <p id="err"></p>
  <script>
  (async function () {
    const qs = location.search || '';
    const liveHref = new URL('d06-live.json', location.href).href + '?t=' + Date.now();
    try {
      const res = await fetch(liveHref, { cache: 'no-store' });
      if (!res.ok) throw new Error('live ' + res.status);
      const data = await res.json();
      const base = String(data && data.url || '').replace(/\/+$/, '');
      if (!/^https:\/\//i.test(base)) throw new Error('no live url');
      location.replace(base + '/d06-dev-erp.html' + qs);
    } catch (err) {
      document.getElementById('msg').textContent = '当前在线地址正在更新。请等 10 秒后刷新；上海电脑和机器人窗口需要保持打开。';
      document.getElementById('err').textContent = String(err && err.message || err);
    }
  })();
  </script>
</body>
</html>
